[tool.poetry]
name = "brain-backend"
version = "0.1.0"
description = "ML Backend optimized for Render"
authors = ["Pankaj <pankaj@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
flask = "^3.1.3"
flask-cors = "^6.0.2"
numpy = "<2.0.0"
